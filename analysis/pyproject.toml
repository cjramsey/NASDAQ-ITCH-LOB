[project]
name = "analysis"
version = "0.1.0"
description = "Order flow imbalance and price impact analysis of the reconstructed ITCH order book"
authors = [
    { name = "cjramsey", email = "cameronramsey04@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "numpy>=2.2.6",
    "plotly>=6.9.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
